<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Photos ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <header class="navbar">

        <a href="index.html" class="logo">
            Our Little World ❤️
        </a>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="games.html">
                Game Moments
            </a>

            <a href="chats.html">
                Chat Moments
            </a>

            <a href="photos.html" class="active">
                Photos
            </a>

        </nav>

    </header>



    <main class="page">


        <section class="page-heading">

            <p class="small-title">
                OUR FAVOURITE MEMORIES
            </p>

            <h1>
                Photos 📸
            </h1>

            <p>
                A little collection of beautiful memories.
            </p>

        </section>



        <section class="photo-gallery">


            <article class="photo-card">

                <div class="photo-wrapper">

                    <img
                        src="soumii.jpg"
                        alt="Our Favourite Photo"
                        onclick="openLightbox(this.src, this.alt)"
                    >

                </div>


                <div class="photo-caption">

                    <span>
                        SPECIAL MEMORY
                    </span>

                    <h2>
                        One Beautiful Memory ❤️
                    </h2>

                    <p>
                        Some pictures say more than words ever could.
                    </p>

                </div>

            </article>


        </section>


    </main>



    <footer>
        Made with ❤️ for our little world.
    </footer>



    <script src="script.js"></script>

</body>
</html>
